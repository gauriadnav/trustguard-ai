{% extends "base.html" %}

{% block title %}Create Account — TrustGuard AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header text-center">
            <div class="auth-shield">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Register for TrustGuard AI</h2>
            <p class="text-muted">Create a secure profile to track your scans and monitor threat analytics.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Choose a username (3-30 characters)"
                        value="{{ username or '' }}"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="name@example.com"
                        value="{{ email or '' }}"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="At least 6 characters"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your password"
                        required
                    >
                </div>
            </div>

            <div class="form-actions-full">
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </div>
        </form>

        <div class="auth-footer text-center">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
